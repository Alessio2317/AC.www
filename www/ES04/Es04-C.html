<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calcolatrice — ES04C</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Syncopate:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #5b6fff;
      --accent2: #00e5c0;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --card: #13131d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 400px; height: 400px; background: rgba(91,111,255,0.12); top: -100px; left: -100px; }
    .blob-2 { width: 300px; height: 300px; background: rgba(0,229,192,0.08); bottom: 0; right: -80px; }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(16px);
    }
    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }
    .nav-back {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 100px;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-back:hover { color: var(--text); border-color: rgba(91,111,255,0.4); }

    .calc-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.5s ease both;
    }

    .calc-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .calc-eyebrow .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 10px var(--accent2);
      animation: pulse 2s ease infinite;
    }
    .calc-eyebrow span {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .calc-tag {
      font-family: 'Syncopate', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
      background: rgba(91,111,255,0.75);
      padding: 3px 10px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(91,111,255,0.4);
      margin-left: auto;
    }

    .calc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }
    .calc-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(91,111,255,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .calc-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .calc-subtitle {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 28px;
    }

    .calc-display {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    .display-expr {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      min-height: 16px;
    }
    .display-result {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }
    .display-result.error { color: #ff6b6b; font-size: 1rem; }
    .display-result.success { color: var(--accent2); }

    .fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 16px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .field-input:focus {
      border-color: rgba(91,111,255,0.6);
      box-shadow: 0 0 0 3px rgba(91,111,255,0.08);
    }
    .field-input::placeholder { color: var(--muted); opacity: 0.6; }

    .op-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .op-btn {
      padding: 10px 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .op-btn:hover { border-color: rgba(91,111,255,0.5); color: var(--text); background: rgba(91,111,255,0.06); }
    .op-btn.active {
      border-color: var(--accent);
      background: rgba(91,111,255,0.15);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(91,111,255,0.2);
    }

    .calc-btn {
      width: 100%;
      padding: 14px;
      background: rgba(91,111,255,0.15);
      border: 1px solid rgba(91,111,255,0.4);
      border-radius: 10px;
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .calc-btn:hover {
      background: rgba(91,111,255,0.25);
      border-color: rgba(91,111,255,0.7);
      box-shadow: 0 6px 24px rgba(91,111,255,0.2);
      transform: translateY(-1px);
    }
    .calc-btn:active { transform: translateY(0); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.2s ease; }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <nav>
    <a href="../index.html" class="nav-logo">AC<span>.</span></a>
    <a href="../index.html" class="nav-back">← Portfolio</a>
  </nav>

  <div class="calc-wrapper">
    <div class="calc-eyebrow">
      <div class="dot"></div>
      <span>ES04 · Esercizio C</span>
      <div class="calc-tag">CALC</div>
    </div>

    <div class="calc-card">
      <h1 class="calc-title">Calcolatrice</h1>
      <p class="calc-subtitle">Inserisci due numeri e seleziona un'operazione</p>

      <div class="calc-display">
        <div class="display-expr" id="expr">—</div>
        <div class="display-result" id="result">0</div>
      </div>

      <div class="fields">
        <div class="field-group">
          <label class="field-label">Primo numero</label>
          <input class="field-input" type="text" id="primoValore" placeholder="es. 12.5" autocomplete="off"/>
        </div>
        <div class="field-group">
          <label class="field-label">Secondo numero</label>
          <input class="field-input" type="text" id="secondoValore" placeholder="es. 3" autocomplete="off"/>
        </div>
      </div>

      <div class="op-grid">
        <button class="op-btn active" data-op="+">+</button>
        <button class="op-btn" data-op="−">−</button>
        <button class="op-btn" data-op="×">×</button>
        <button class="op-btn" data-op="÷">÷</button>
        <button class="op-btn" data-op="**">xʸ</button>
      </div>

      <button class="calc-btn" id="calcBtn">Calcola →</button>
    </div>
  </div>

  <script>
    const opBtns = document.querySelectorAll('.op-btn');
    let selectedOp = '+';

    opBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        opBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedOp = btn.dataset.op;
      });
    });

    const opMap = { '+': '+', '−': '-', '×': '*', '÷': '/', '**': '**' };
    const opLabel = { '+': '+', '−': '−', '×': '×', '÷': '÷', '**': '^' };

    document.getElementById('calcBtn').addEventListener('click', calcola);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') calcola(); });

    function calcola() {
      const a = parseFloat(document.getElementById('primoValore').value);
      const b = parseFloat(document.getElementById('secondoValore').value);
      const exprEl = document.getElementById('expr');
      const resultEl = document.getElementById('result');

      resultEl.className = 'display-result';

      if (Number.isNaN(a) || Number.isNaN(b)) {
        exprEl.textContent = '—';
        resultEl.textContent = 'Inserisci due numeri validi';
        resultEl.classList.add('error');
        return;
      }

      const realOp = opMap[selectedOp];
      exprEl.textContent = `${a} ${opLabel[selectedOp]} ${b}`;

      let esito;
      try {
        if (realOp === '+') esito = a + b;
        else if (realOp === '-') esito = a - b;
        else if (realOp === '*') esito = a * b;
        else if (realOp === '/') {
          if (b === 0) throw new Error('Divisione per zero');
          esito = a / b;
        }
        else if (realOp === '**') esito = a ** b;

        const formatted = Number.isInteger(esito) ? esito : parseFloat(esito.toFixed(10));
        resultEl.textContent = formatted;
        resultEl.classList.add('success');
      } catch (err) {
        resultEl.textContent = err.message;
        resultEl.classList.add('error');
      }

      resultEl.classList.remove('pop');
      void resultEl.offsetWidth;
      resultEl.classList.add('pop');
    }
  </script>
</body>
</html>
