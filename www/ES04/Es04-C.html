<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calcolatrice — ES04C</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Syncopate:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #5b6fff;
      --accent2: #00e5c0;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --card: #13131d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 400px; height: 400px; background: rgba(91,111,255,0.12); top: -100px; left: -100px; }
    .blob-2 { width: 300px; height: 300px; background: rgba(0,229,192,0.08); bottom: 0; right: -80px; }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(16px);
    }
    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }
    .nav-back {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 100px;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-back:hover { color: var(--text); border-color: rgba(91,111,255,0.4); }

    .calc-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      animation: fadeUp 0.5s ease both;
    }

    .calc-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .calc-eyebrow .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 10px var(--accent2);
      animation: pulse 2s ease infinite;
    }
    .calc-eyebrow span {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .calc-tag {
      font-family: 'Syncopate', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
      background: rgba(91,111,255,0.75);
      padding: 3px 10px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(91,111,255,0.4);
      margin-left: auto;
    }

    .calc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .calc-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(91,111,255,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .calc-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .calc-subtitle {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 22px;
    }

    /* ── Display ── */
    .calc-display {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    .display-expr {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      min-height: 16px;
    }
    .display-result {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }
    .display-result.error { color: #ff6b6b; font-size: 1rem; }
    .display-result.success { color: var(--accent2); }

    /* ── Buttons grid ── */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn {
      height: 58px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover {
      border-color: rgba(91,111,255,0.4);
      background: rgba(91,111,255,0.05);
    }
    .btn:active { transform: scale(0.95); }

    /* operator buttons */
    .btn-op {
      background: rgba(91,111,255,0.1);
      border-color: rgba(91,111,255,0.25);
      color: var(--accent);
      font-size: 1.3rem;
    }
    .btn-op:hover {
      background: rgba(91,111,255,0.2);
      border-color: var(--accent);
    }
    .btn-op.active {
      background: rgba(91,111,255,0.22);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(91,111,255,0.25);
    }

    /* = button */
    .btn-eq {
      background: rgba(91,111,255,0.15);
      border-color: rgba(91,111,255,0.4);
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .btn-eq:hover {
      background: rgba(91,111,255,0.28);
      border-color: rgba(91,111,255,0.7);
      box-shadow: 0 4px 20px rgba(91,111,255,0.2);
      transform: translateY(-1px);
    }

    /* clear / special */
    .btn-clear {
      background: rgba(255,107,107,0.08);
      border-color: rgba(255,107,107,0.2);
      color: #ff6b6b;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    .btn-clear:hover { background: rgba(255,107,107,0.15); border-color: rgba(255,107,107,0.4); }

    .btn-special {
      background: rgba(0,229,192,0.06);
      border-color: rgba(0,229,192,0.15);
      color: var(--accent2);
      font-size: 0.9rem;
    }
    .btn-special:hover { background: rgba(0,229,192,0.12); border-color: rgba(0,229,192,0.3); }

    /* zero spans 2 cols */
    .btn-zero { grid-column: span 2; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.18s ease; }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <nav>
    <a href="../index.html" class="nav-logo">AC<span>.</span></a>
    <a href="../index.html" class="nav-back">← Portfolio</a>
  </nav>

  <div class="calc-wrapper">
    <div class="calc-eyebrow">
      <div class="dot"></div>
      <span>ES04 · Esercizio C</span>
      <div class="calc-tag">CALC</div>
    </div>

    <div class="calc-card">
      <h1 class="calc-title">Calcolatrice</h1>
      <p class="calc-subtitle">Calcolatrice stile iOS con memoria operazione</p>

      <div class="calc-display">
        <div class="display-expr" id="expr"></div>
        <div class="display-result" id="result">0</div>
      </div>

      <div class="btn-grid">
        <!-- row 1 -->
        <button class="btn btn-clear" id="btnAC">AC</button>
        <button class="btn btn-special" id="btnSign">+/−</button>
        <button class="btn btn-special" id="btnPct">%</button>
        <button class="btn btn-op" data-op="÷">÷</button>

        <!-- row 2 -->
        <button class="btn" data-num="7">7</button>
        <button class="btn" data-num="8">8</button>
        <button class="btn" data-num="9">9</button>
        <button class="btn btn-op" data-op="×">×</button>

        <!-- row 3 -->
        <button class="btn" data-num="4">4</button>
        <button class="btn" data-num="5">5</button>
        <button class="btn" data-num="6">6</button>
        <button class="btn btn-op" data-op="−">−</button>

        <!-- row 4 -->
        <button class="btn" data-num="1">1</button>
        <button class="btn" data-num="2">2</button>
        <button class="btn" data-num="3">3</button>
        <button class="btn btn-op" data-op="+">+</button>

        <!-- row 5 -->
        <button class="btn btn-zero" data-num="0">0</button>
        <button class="btn" data-num=".">.</button>
        <button class="btn btn-eq" id="btnEq">=</button>
      </div>
    </div>
  </div>

  <script>
    const displayEl = document.getElementById('result');
    const exprEl    = document.getElementById('expr');

    let current  = '0';
    let previous = null;
    let operator = null;
    let freshInput = false;

    const opMap   = { '÷': '/', '×': '*', '−': '-', '+': '+' };
    const opLabel = { '÷': '÷', '×': '×', '−': '−', '+': '+' };

    /* ── Helpers ── */
    function setDisplay(val) {
      displayEl.className = 'display-result';
      const s = String(val);
      displayEl.textContent = s.length > 12
        ? parseFloat(parseFloat(val).toPrecision(9)).toString()
        : s;
      triggerPop();
    }

    function setError(msg) {
      displayEl.className = 'display-result error';
      displayEl.textContent = msg;
      triggerPop();
    }

    function setSuccess(val) {
      displayEl.className = 'display-result success';
      const s = String(val);
      displayEl.textContent = s.length > 12
        ? parseFloat(parseFloat(val).toPrecision(9)).toString()
        : s;
      triggerPop();
    }

    function triggerPop() {
      displayEl.classList.remove('pop');
      void displayEl.offsetWidth;
      displayEl.classList.add('pop');
    }

    function markOp(active) {
      document.querySelectorAll('.btn-op').forEach(b =>
        b.classList.toggle('active', b.dataset.op === active)
      );
    }

    /* ── Number input ── */
    document.querySelectorAll('[data-num]').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.num;
        if (freshInput || current === '0') {
          current = (d === '.') ? '0.' : d;
          freshInput = false;
        } else {
          if (d === '.') { if (!current.includes('.')) current += '.'; }
          else if (current.length < 12) current += d;
        }
        setDisplay(current);
      });
    });

    /* ── Operator ── */
    document.querySelectorAll('[data-op]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = btn.dataset.op;
        if (previous !== null && !freshInput) compute(false);
        previous = parseFloat(current);
        operator = o;
        freshInput = true;
        exprEl.textContent = previous + ' ' + opLabel[o];
        markOp(o);
        displayEl.className = 'display-result';
      });
    });

    /* ── Equals ── */
    document.getElementById('btnEq').addEventListener('click', () => {
      compute(true);
      markOp(null);
    });

    /* ── AC ── */
    document.getElementById('btnAC').addEventListener('click', () => {
      current = '0'; previous = null; operator = null; freshInput = false;
      exprEl.textContent = '';
      setDisplay('0');
      markOp(null);
    });

    /* ── +/− ── */
    document.getElementById('btnSign').addEventListener('click', () => {
      current = String(parseFloat(current) * -1);
      setDisplay(current);
    });

    /* ── % ── */
    document.getElementById('btnPct').addEventListener('click', () => {
      current = String(parseFloat(current) / 100);
      setDisplay(current);
    });

    /* ── Compute ── */
    function compute(final) {
      if (operator === null || previous === null) return;
      const b = parseFloat(current);
      const realOp = opMap[operator];
      if (final) {
        exprEl.textContent = previous + ' ' + opLabel[operator] + ' ' + b + ' =';
      }
      let result;
      try {
        if (realOp === '/') {
          if (b === 0) { setError('Div per zero'); previous = null; operator = null; return; }
          result = previous / b;
        } else if (realOp === '*') result = previous * b;
        else if (realOp === '-') result = previous - b;
        else result = previous + b;

        const formatted = parseFloat(result.toPrecision(10));
        current = String(formatted);
        if (final) { setSuccess(formatted); previous = null; operator = null; }
        else { setDisplay(formatted); previous = formatted; }
        freshInput = true;
      } catch(e) { setError('Errore'); }
    }

    /* ── Keyboard ── */
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') document.querySelector(`[data-num="${e.key}"]`)?.click();
      else if (e.key === '.') document.querySelector('[data-num="."]')?.click();
      else if (e.key === '+') document.querySelector('[data-op="+"]')?.click();
      else if (e.key === '-') document.querySelector('[data-op="−"]')?.click();
      else if (e.key === '*') document.querySelector('[data-op="×"]')?.click();
      else if (e.key === '/') { e.preventDefault(); document.querySelector('[data-op="÷"]')?.click(); }
      else if (e.key === 'Enter' || e.key === '=') document.getElementById('btnEq').click();
      else if (e.key === 'Escape') document.getElementById('btnAC').click();
      else if (e.key === 'Backspace') {
        if (current.length > 1) { current = current.slice(0, -1); setDisplay(current); }
        else { current = '0'; setDisplay('0'); }
      }
    });
  </script>
</body>
</html>
